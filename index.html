        function App() {

            const [userAnswers, setUserAnswers] = useState({});

            const [submitted, setSubmitted] = useState(false);
            const [darkMode, setDarkMode] = useState(false);
            const [stats, setStats] = useState(() => {
                const saved = localStorage.getItem('nptel_quiz_stats');
                return saved ? JSON.parse(saved) : {};
            });

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');

                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const currentWeekData = quizData.weeks.find(w => w.weekNumber === selectedWeek);

                if (submitted) return;
                setUserAnswers({ ...userAnswers, [qId]: optionChar });
            };

                e.stopPropagation();
                setFlagged({ ...flagged, [qId]: !flagged[qId] });
            };

                setSubmitted(true);
                let score = 0;
                currentWeekData.questions.forEach(q => {

                setStats(newStats);
                localStorage.setItem('nptel_quiz_stats', JSON.stringify(newStats));
            };

                setUserAnswers({});
                setFlagged({});
                setSubmitted(false);
            };

                <div className={`min-h-screen transition-colors duration-200 ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>

                                            selectedWeek === w.weekNumber

                                                                {opt}

                                                    })}
                                                </div>

                                                {submitted && (
                                                    <div className={`p-4 rounded-xl text-sm border mt-3 ${darkMode ? 'bg-slate-900/60 border-slate-700 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                        <span className="font-semibold text-indigo-400 block mb-1">Explanation / Rationale:</span>
                                                        {q.explanation}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-8 pt-6 border-t border-slate-200/20 flex justify-end gap-4">
                                    {!submitted ? (
                                        <button
                                            onClick={handleSubmit}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl shadow-md transition-all"
                                        >
                                            Submit Quiz
                                        </button>
                                    ) : (
                                        <button
                                            onClick={handleReset}
                                            className="bg-slate-700 hover:bg-slate-800 text-white font-medium px-6 py-2.5 rounded-xl shadow-md transition-all"
                                        >
                                            Try Again
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Sidebar: Question Quick Status Grid */}
                            <div className="space-y-6">
                                <div className={`rounded-2xl p-6 border shadow-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <h3 className="font-bold text-base mb-4">Question Navigator</h3>
                                    <div className="grid grid-cols-5 gap-2">
                                        {currentWeekData.questions.map((q, idx) => {
                                            const isAns = userAnswers[q.id];
                                            const isFlg = flagged[q.id];
                                            let statusBg = darkMode ? "bg-slate-700 text-slate-300" : "bg-slate-100 text-slate-600";

                                            if (submitted) {
                                                statusBg = userAnswers[q.id] === q.answer ? "bg-emerald-600 text-white" : "bg-rose-600 text-white";
                                            } else if (isFlg) {
                                                statusBg = "bg-amber-500 text-white";
                                            } else if (isAns) {
                                                statusBg = "bg-indigo-600 text-white";
                                            }

                                            return (
                                                <div 
                                                    key={q.id}
                                                    className={`h-10 rounded-xl font-semibold flex items-center justify-center text-sm transition-all ${statusBg}`}
                                                >
                                                    {idx + 1}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-4 space-y-2 text-xs text-slate-400">
                                        <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-indigo-600 inline-block"></span> Answered</div>
                                        <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Flagged for review</div>
                                        <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-slate-500/30 inline-block"></span> Unanswered</div>
                                    </div>
                                </div>

                                {/* Past Performance Tracker */}
                                <div className={`rounded-2xl p-6 border shadow-sm ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <h3 className="font-bold text-base mb-3">Your Progress</h3>
                                    {Object.keys(stats).length === 0 ? (
                                        <p className="text-sm text-slate-400">No quiz attempts recorded yet. Complete a week to view your score history!</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {Object.entries(stats).map(([wk, data]) => (
                                                <div key={wk} className="flex justify-between items-center text-sm border-b pb-2 border-slate-700/30 last:border-0">
                                                    <span>Week {wk}</span>
                                                    <span className="font-semibold text-emerald-500">{data.score} / {data.total}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
