                { id: "w9_q9", question: "The Centre of Gravity (CG) model is a mathematical approach primarily used to determine the optimal location for a new facility by minimizing which of the following?", options: ["A) Local property and corporate income tax rates", "B) Transportation costs associated with serving multiple locations", "C) Employee turnover and training costs", "D) Environmental regulations and compliance fees"], answer: "B" },
                { id: "w9_q10", question: "According to the case study, how did Dell's distribution model change in 2007?", options: ["A) They completely shut down their online sales channel", "B) They began distributing their products through retail stores like Wal-Mart", "C) They shifted entirely to a distributor storage with carrier delivery network", "D) They stopped selling customized hardware to focus only on standardized PCs"], answer: "B" }
              ]
            },
            {
              weekNumber: 10,
              questions: [
                { id: "w10_q1", question: "According to demand forecasting is the process of understanding and predicting customer demand to help businesses avoid which of the following?", options: ["A) High shipping costs and bad PR", "B) Overproduction and underproduction", "C) Competition entering the market", "D) Falling crude oil prices"], answer: "B" },
                { id: "w10_q2", question: "If a business sells swimwear and strategically decides to store the majority of its inventory in Florida where it is ordered most, which factor influencing demand forecast are they addressing?", options: ["A) Competition", "B) Economy", "C) Geography", "D) Seasonality"], answer: "C" },
                { id: "w10_q3", question: "Why can relying too heavily on historical sales data lead to inaccurate demand predictions?", options: ["A) Because past data cannot account for various evolving market factors", "B) Because past data is completely deleted every calendar year", "C) Because historical data is only useful for startup businesses", "D) Because it forces companies to hire too many data analysts"], answer: "A" },
                { id: "w10_q4", question: "What does expert or insider knowledge refer to in the context of demand forecasting?", options: ["A) Information gathered strictly from automated internet search bots", "B) Specialized understanding and insights held by individuals with significant experience in a particular field or industry", "C) Financial data publicly released by international banking institutions", "D) Customer feedback forms collected randomly from retail storefronts"], answer: "B" },
                { id: "w10_q5", question: "Which of the following correctly identifies the formula used to calculate a facility's Efficiency percentage?", options: ["A) Efficiency = (Actual Output / Design Capacity) * 100%", "B) Efficiency = (Effective Capacity / Design Capacity) * 100%", "C) Efficiency = (Actual Output / Effective Capacity) * 100%", "D) Efficiency = (Design Capacity - Allowances) * 100%"], answer: "C" },
                { id: "w10_q6", question: "What are the four major components that make up transportation decisions in supply chain management?", options: ["A) Production, Planning, Efficiency, and Utilization", "B) Fixed Cost, Variable Cost, Revenue, and Profit", "C) Load, Mode, Flow, and Route", "D) Interviews, Focus Groups, Surveys, and Delphi Method"], answer: "C" },
                { id: "w10_q7", question: "According to a Balanced Transportation Problem is a special case where which of the following conditions is met?", options: ["A) The total variable costs exactly equal the total fixed costs", "B) The total supply from all sources equals the total demand at all destinations", "C) The shipment volume is optimized using only rail and road transit", "D) The number of source factories is exactly equal to the number of retail outlets"], answer: "B" },
                { id: "w10_q8", question: "How does accurate demand forecasting help a business strike the right balance in inventory management?", options: ["A) By reducing carrying costs and preventing stockouts", "B) By ensuring that products are only sold online", "C) By automatically increasing the prices of older items", "D) By replacing human workers with automated machinery"], answer: "A" },
                { id: "w10_q9", question: "Which type of capacity planning considers future requirements over several years and utilizes supply and need forecasting to align carefully with business goals and growth?", options: ["A) Short-term Capacity Planning", "B) Operational Capacity Planning", "C) Medium-term Capacity Planning", "D) Long-term or Strategic Capacity Planning"], answer: "D" },
                { id: "w10_q10", question: "Which of the following sets of factors is explicitly mentioned as a reason why companies have limited visibility into the future when predicting demand?", options: ["A) Overproduction, underproduction, and short shelf-lives", "B) Lack of human resources, bad PR, and high shipping costs", "C) Market volatility, rapid technological changes, and unpredictable external events", "D) Steady customer retention, passive forecasting, and geographic planning"], answer: "C" }
              ]
            },
            {
              weekNumber: 11,
              questions: [
                { id: "w11_q1", question: "Which of the following formulas is used to calculate Minimum Stock?", options: ["A) Minimum Stock = Safety Stock - Buffer Stock", "B) Minimum Stock = Buffer Stock + Safety Stock", "C) Minimum Stock = Reorder level + Safety Stock", "D) Minimum Stock = Maximum Daily Sales + Maximum Lead Time"], answer: "B" },
                { id: "w11_q2", question: "Which type of inventory consists of items kept in reserve to be processed by a second machine if the first machine fails?", options: ["A) Cycle Inventory", "B) Transit Inventory", "C) MRO Inventory", "D) Decoupling Inventory"], answer: "D" },
                { id: "w11_q3", question: "What does the Days Sales of Inventory (DSI) metric specifically indicate about a company's inventory?", options: ["A) The total cost of raw materials purchased in a single year.", "B) The percentage of profit earned from each unit of inventory sold.", "C) The maximum number of days a company can store finished goods before they expire.", "D) The average time in days it takes for a company to turn its inventory into sales."], answer: "D" },
                { id: "w11_q4", question: "The 'Zero Inventory' concept is primarily based on which manufacturing and inventory management strategy?", options: ["A) Bulk Ordering Strategy", "B) Over-Stocking Principle", "C) Just-In-Time (JIT)", "D) Manual Data Recording"], answer: "C" },
                { id: "w11_q5", question: "What is the ultimate goal of a resilient supply chain?", options: ["A) To bounce back from disruptions and learn from them to improve future performance", "B) To ensure a company never has to change its suppliers", "C) To eliminate all human workers from the manufacturing process", "D) To increase the amount of paperwork required for every transaction"], answer: "A" },
                { id: "w11_q6", question: "Which of the following is a key benefit of supply chain digitization that helps companies avoid high stockout costs?", options: ["A) Better financial management through automated reorder notifications", "B) Manual record-keeping", "C) Increased reliance on paper-based documentation", "D) Eliminating all human workers from the warehouse"], answer: "A" },
                { id: "w11_q7", question: "What is the core principle of Vendor Managed Inventory (VMI)?", options: ["A) The retailer is solely responsible for managing all stock in the warehouse.", "B) Inventory is only managed once it has been fully depleted.", "C) Customers must manage the inventory themselves before making a purchase.", "D) The supplier assumes responsibility for managing the inventory at the retailer's location."], answer: "D" },
                { id: "w11_q8", question: "In the ABC Analysis model, which category of inventory typically represents only 20% of the total stock but accounts for 70% of the total income?", options: ["A) Category C", "B) Category B", "C) Category A", "D) Category D"], answer: "C" },
                { id: "w11_q9", question: "Which of the following is a key component of supply chain digitization that uses devices like sensors and RFID tags to collect real-time data on inventory and shipments?", options: ["A) Manual Ledger Entry", "B) Traditional Filing Systems", "C) Paper-based Documentation", "D) Internet of Things (IoT)"], answer: "D" },
                { id: "w11_q10", question: "In the context of supply chain management and digitization, what does the abbreviation ERP stand for?", options: ["A) Enterprise Resource Planning", "B) Electronic Resource Planning", "C) Efficient Retail Processing", "D) Essential Reliable Procurement"], answer: "A" }
              ]
            },
            {
              weekNumber: 12,
              questions: [
                { id: "w12_q1", question: "What is the core goal of supply chain sustainability?", options: ["A) To minimize environmental harm from factors like energy, water, and waste", "B) To replace traditional corporate supply chain concerns entirely", "C) To focus exclusively on raw material sourcing and ignore storage or delivery", "D) To find the fastest transportation links available"], answer: "A" },
                { id: "w12_q2", question: "Who originally coined and developed the concept of the Triple Bottom Line?", options: ["A) John Elkington", "B) Michael Porter", "C) Edward Freeman", "D) Peter Drucker"], answer: "A" },
                { id: "w12_q3", question: "Goods that are currently in the middle of being manufactured but are not yet completed are classified as what type of asset?", options: ["A) Raw Materials", "B) Work-in-Progress (WIP)", "C) Packaging Materials", "D) Finished Goods"], answer: "B" },
                { id: "w12_q4", question: "Which of the following represents a traditional corporate supply chain concern that exists in addition to sustainability efforts?", options: ["A) Human impact on communities", "B) Water consumption", "C) Revenue and profit", "D) Energy usage"], answer: "C" },
                { id: "w12_q5", question: "What is the primary barrier to implementing sustainable supply chains?", options: ["A) Lack of corporate offices", "B) Cost", "C) Fast shipping speeds", "D) Excessive software options"], answer: "B" },
                { id: "w12_q6", question: "Why do conventional supply chains adopt proactive or reactive strategies?", options: ["A) To completely change their business model every year", "B) To shut down all local operations permanently", "C) To address disruptions like fires, floods, or labour strikes", "D) To avoid using any transportation networks"], answer: "C" },
                { id: "w12_q7", question: "Which type of supply chain asset refers to the initial components or materials used to start the production process?", options: ["A) Raw Materials", "B) Tools and Equipment", "C) Finished Goods", "D) Work-in-Progress (WIP)"], answer: "A" },
                { id: "w12_q8", question: "Which specific real-world event is explicitly highlighted as an example of effective humanitarian supply chain coordination?", options: ["A) The 2024 global shipping route restructuring", "B) The EY sustainability survey launch", "C) The Unilever global distribution expansion", "D) The 2015 Nepal earthquake"], answer: "D" },
                { id: "w12_q9", question: "What is the meaning of supply chain asset?", options: ["A) Any tangible or intangible resource within a supply chain that contributes to its overall functioning and value creation", "B) Only the cash stored in a company's corporate bank account", "C) A government tax applied to international shipping routes", "D) The total number of customers who buy a product online"], answer: "A" },
                { id: "w12_q10", question: "Unlike inventory management, Asset Management is responsible for managing items:", options: ["A) Only when customers return them due to dissatisfaction", "B) With minimal contact and minimal details recorded", "C) Through their complete life cycles, from procurement to disposal", "D) Strictly to replenish goods and parts to sell to customers"], answer: "C" }
              ]
            }
          ]
        };

        function App() {
            const [selectedWeek, setSelectedWeek] = useState(1);
            const [userAnswers, setUserAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const currentWeekData = quizData.weeks.find(w => w.weekNumber === selectedWeek);

            const handleOptionSelect = (qId, optionChar) => {
                if (submitted) return;
                setUserAnswers({ ...userAnswers, [qId]: optionChar });
            };

            const handleSubmit = () => {
                setSubmitted(true);
            };

            const handleReset = () => {
                setUserAnswers({});
                setSubmitted(false);
            };

            let score = 0;
            if (submitted) {
                currentWeekData.questions.forEach(q => {
                    if (userAnswers[q.id] === q.answer) score++;
                });
            }

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <header className="bg-indigo-600 text-white rounded-2xl p-6 shadow-lg mb-8">
                        <h1 className="text-2xl md:text-3xl font-bold mb-2">NPTEL Practice Portal</h1>
                        <p className="text-indigo-100 text-sm md:text-base">{quizData.course}</p>
                    </header>

                    <div className="flex gap-2 overflow-x-auto pb-4 mb-6">
                        {quizData.weeks.map(w => (
                            <button
                                key={w.weekNumber}
                                onClick={() => { setSelectedWeek(w.weekNumber); setSubmitted(false); setUserAnswers({}); }}
                                className={`px-4 py-2 rounded-xl font-medium whitespace-nowrap transition-all ${selectedWeek === w.weekNumber ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                            >
                                Week {w.weekNumber}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 mb-6">
                        <div className="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                            <h2 className="text-xl font-bold text-slate-800">Week {selectedWeek} Assignment</h2>
                            <span className="text-sm font-semibold bg-slate-100 text-slate-600 px-3 py-1 rounded-full">10 Questions</span>
                        </div>

                        {submitted && (
                            <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-6 mb-8 text-center">
                                <h3 className="text-lg font-bold text-indigo-900 mb-1">Quiz Completed!</h3>
                                <p className="text-3xl font-extrabold text-indigo-600 mb-2">{score} / 10</p>
                                <p className="text-sm text-indigo-700">Your accuracy: {(score / 10) * 100}%</p>
                            </div>
                        )}

                        <div className="space-y-8">
                            {currentWeekData.questions.map((q, idx) => {
                                const userOpt = userAnswers[q.id];
                                const isCorrect = userOpt === q.answer;
                                return (
                                    <div key={q.id} className="border-b border-slate-100 pb-6 last:border-0">
                                        <p className="font-semibold text-slate-900 mb-4">
                                            <span className="text-indigo-600 mr-2">Q{idx + 1}.</span> {q.question}
                                        </p>
                                        <div className="space-y-2">
                                            {q.options.map(opt => {
                                                const optLetter = opt.charAt(0);
                                                const isSelected = userOpt === optLetter;
                                                let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
                                                
                                                if (submitted) {
                                                    if (optLetter === q.answer) {
                                                        btnStyle = "bg-emerald-50 border-emerald-300 text-emerald-900 font-medium";
                                                    } else if (isSelected && !isCorrect) {
                                                        btnStyle = "bg-rose-50 border-rose-300 text-rose-900";
                                                    }
                                                } else if (isSelected) {
                                                    btnStyle = "bg-indigo-50 border-indigo-300 text-indigo-900 font-medium";
                                                }

                                                return (
                                                    <button
                                                        key={optLetter}
                                                        onClick={() => handleOptionSelect(q.id, optLetter)}
                                                        disabled={submitted}
                                                        className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${btnStyle}`}
                                                    >
                                                        {opt}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-8 pt-6 border-t border-slate-100 flex justify-end gap-4">
                            {!submitted ? (
                                <button
                                    onClick={handleSubmit}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl shadow-md transition-all"
                                >
                                    Submit Quiz
                                </button>
                            ) : (
                                <button
                                    onClick={handleReset}
                                    className="bg-slate-800 hover:bg-slate-900 text-white font-medium px-6 py-2.5 rounded-xl shadow-md transition-all"
                                >
                                    Try Again
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
